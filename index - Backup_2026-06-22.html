<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://app.powerbi.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jorge Riquelme — Data Analyst</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arman2riquelme.github.io/">
  <meta property="og:title" content="Jorge Riquelme — Data Analysis & Architecture Portfolio">
  <meta property="og:description" content="Institutional Intelligence, DataMart Design, and Evidence-Based Analytical Frameworks. Turning technical debt into operational architecture.">
  <meta property="og:image" content="https://arman2riquelme.github.io/images/Preview_Links.png">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#1A1C1E; --bg-card:#22252A; --text:#E6E6E6; --muted:#9BA4B0; --gold:#D4AF37; --gold-dim:rgba(212,175,55,0.15); --gold-soft:rgba(212,175,55,0.3); --border:rgba(155,164,176,0.1); }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0.8rem 4rem 0.5rem;background:rgba(26,28,30,0.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:1rem;color:var(--gold);letter-spacing:0.05em;text-decoration:none;}
    .nav-links{display:flex;gap:2.5rem;list-style:none;}
    .nav-links a{color:var(--muted);text-decoration:none;font-weight:400;font-size:0.875rem;letter-spacing:0.03em;transition:color 0.2s;}
    .nav-links a:hover{color:var(--gold);}
    #hero{min-height:60vh;display:flex;align-items:center;padding:4rem 4rem 2rem;position:relative;overflow:hidden;}
    #hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#1A1C1E 60%,#1f2226 100%);z-index:0;}
    #hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,0.03) 1px,transparent 1px);background-size:60px 60px;z-index:0;}
    .hero-container{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr 0.8fr;gap:4rem;width:100%;align-items:center;}
    .hero-main{max-width:760px;}
    .hero-greeting{font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.75rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.1s;}
    .hero-name{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:clamp(2.8rem,6vw,4.5rem);color:var(--gold);line-height:1.1;letter-spacing:-0.02em;margin-bottom:1.25rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.25s;}
    .hero-tagline{font-size:clamp(1rem,2vw,1.2rem);font-weight:300;color:var(--muted);letter-spacing:0.5px;max-width:560px;margin-bottom:2.5rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.4s;}
    .hero-tagline span{color:var(--text);font-weight:400;}
    .btn-outline{display:inline-block;padding:0.75rem 2rem;border:1.5px solid var(--gold);color:var(--gold);background:transparent;border-radius:4px;font-family:"Inter",sans-serif;font-weight:400;font-size:0.9rem;letter-spacing:0.05em;text-decoration:none;box-shadow:0 4px 14px 0 var(--gold-dim);transition:all 0.3s cubic-bezier(0.4,0,0.2,1);cursor:pointer;opacity:0;animation:fadeUp 0.6s ease forwards 0.55s;}
    .btn-outline:hover{background:var(--gold);color:var(--bg);}
    .hero-pillars{display:flex;flex-direction:column;gap:2.5rem;border-left:1px solid var(--border);padding-left:2.5rem;opacity:0;animation:fadeUp 0.6s ease forwards 0.7s;}
    .pillar-item h3{font-family:"JetBrains Mono",monospace;font-size:0.85rem;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;}
    .pillar-item p{font-size:0.9rem;color:var(--muted);line-height:1.4;font-weight:300;}
    section{padding:6rem 4rem;max-width:1200px;margin:0 auto;}
    .section-label{font-size:0.75rem;font-weight:400;color:var(--gold);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.5rem;}
    .section-title{font-family:"Inter",sans-serif;font-weight:600;font-size:clamp(1.6rem,3vw,2.2rem);color:var(--text);margin-bottom:1.5rem;line-height:1.2;}
    .section-divider{width:48px;height:2px;background:var(--gold);margin-bottom:2.5rem;}
    #about p{color:var(--muted);font-weight:300;font-size:1.05rem;max-width:780px;margin-bottom:1.2rem;letter-spacing:0.3px;}
    #about p strong{color:var(--text);font-weight:400;}
    #skills{margin:0 0 3rem;}
    .skills-grid{display:flex;flex-wrap:wrap;gap:0.45rem;margin-top:0;}
    .skill-pill{padding:0.3rem 0.8rem;border:1px solid var(--gold-soft);color:var(--muted);border-radius:4px;font-size:0.72rem;font-weight:400;letter-spacing:0.03em;transition:all 0.2s ease;cursor:default;}
    .skill-pill:hover{border-color:var(--gold);color:var(--gold);}
    #projects{max-width:1200px;margin:0 auto;padding:4rem 4rem;}
    .category-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:3.5rem;}
    .category-card{padding:1.5rem;background:var(--bg-card);border:1px solid var(--gold-soft);border-radius:4px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;}
    .category-card::before{content:"";position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--gold);transition:width 0.3s ease;}
    .category-card:hover::before,.category-card.active::before{width:100%;}
    .category-card:hover,.category-card.active{border-color:var(--gold);box-shadow:0 4px 24px var(--gold-dim);}
    .category-card.active .cat-title{color:var(--gold);}
    .cat-icon{font-size:1.4rem;margin-bottom:0.75rem;}
    .cat-title{font-weight:600;font-size:0.95rem;color:var(--text);margin-bottom:0.4rem;transition:color 0.2s;}
    .cat-desc{font-size:0.8rem;color:var(--muted);font-weight:300;line-height:1.5;}
    .project-panel{display:none;}
    .project-panel.active{display:block;}
    /* Power BI responsive embed classes */
    .pbi-17x9{position:relative;width:100%;height:0;padding-bottom:52.94%;border:1px solid var(--gold-soft);border-radius:4px;overflow:hidden;background:var(--bg-card);}...
